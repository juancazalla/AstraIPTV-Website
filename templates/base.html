<!doctype html>
<!-- Generated by scripts/build.py. Edit content/locales or templates instead. -->
<html lang="$lang" dir="$direction">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090909">
  <title>$title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
$alternates
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$og_image">
  <meta property="og:image:alt" content="$tv_alt">
  <meta property="og:site_name" content="Astra IPTV">
  <link rel="icon" type="image/png" href="${prefix}assets/astra-mark.png">
  <link rel="stylesheet" href="${prefix}styles.css?v=$css_version">
</head>
<body>
  <a class="skip" href="#main">$skip</a>
  <header class="site-header">
    <div class="header-inner">
      $brand
      <nav class="main-nav" aria-label="$nav">
        $navigation
      </nav>
      <details class="languages">
        <summary aria-label="$language: $locale_name">$globe <bdi>$locale_name</bdi> <span class="chevron" aria-hidden="true"></span></summary>
        <nav aria-label="$language" class="language-menu">
$language_links
        </nav>
      </details>
    </div>
  </header>
$main
  <footer class="site-footer wrap">
    <div>$brand<p>$footer</p></div>
    <nav aria-label="$related">
      <a href="$guide_url">$guide</a>
      <a href="$support_url">$support</a>
      <a href="$privacy_url">$privacy</a>
      <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">$github_privacy</a>
    </nav>
    <p class="copyright"><bdi>© 2026 Juan Cazalla Estrella</bdi></p>
  </footer>
</body>
</html>
